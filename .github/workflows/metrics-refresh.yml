name: Weekly metrics refresh

# Refreshes the four numbers in the metrics band of site/index.html
# (Publications / Citations / h-index / i10-index) and pushes to master,
# which Cloudflare Pages auto-deploys.
#
# Citations / h-index / i10-index come from Google Scholar (fetched through a
# fallback chain — Scholar serves a stub to datacenter IPs like this runner's);
# Publications comes from the CV header. See .github/scripts/update_metrics.py.
#
# Runs entirely on GitHub's infrastructure: no local machine and no Claude
# session needed, and GITHUB_TOKEN already carries contents:write (the previous
# cloud-routine approach failed with HTTP 403 on git-receive-pack).
#
# If every Scholar source is blocked the run FAILS on purpose, so GitHub emails
# the repo owner instead of silently skipping a week.

on:
  schedule:
    # Daily, because retrying is only useful across runs: a runner holds one
    # outbound IP for a whole job, and Scholar's block is per-IP. Runs are
    # idempotent (no change -> no commit), so a daily attempt is free and the
    # numbers are never more than a day stale once a fetch gets through.
    - cron: '7 16 * * *'   # 16:07 UTC ≈ 9:07am PT
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Parse and report only; do not commit'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master

      - name: Install poppler (pdftotext)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Refresh metrics in site/index.html
        id: update
        # Exit 2 = every Scholar source refused this runner's IP. That is
        # expected on some days and not worth an email, so swallow it here; the
        # staleness canary below is what catches a genuine, lasting breakage.
        run: |
          set +e
          python3 .github/scripts/update_metrics.py
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$code"

      - name: Commit and push
        if: steps.update.outputs.changed == 'true' && inputs.dry_run != true
        env:
          SUMMARY: ${{ steps.update.outputs.summary }}
        run: |
          git config user.name  'Jee-weon Jung'
          git config user.email 'jeeweonj@ieee.org'
          git add site/index.html
          git commit -m 'chore: weekly metrics refresh' \
                     -m "$SUMMARY" \
                     -m 'Automated by .github/workflows/metrics-refresh.yml'
          git push origin HEAD:master

      - name: Escalate a block once a week
        # Blocked runs are normal and silent, or you'd get mail most days for
        # something that fixes itself. But silence must not hide a permanent
        # break, so on Mondays a block is treated as a failure — at most one
        # email a week, and no state to keep anywhere. If Monday is blocked but
        # Tuesday gets through, the only cost is one false alarm.
        if: steps.update.outputs.blocked == 'true' && inputs.dry_run != true
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            echo "::error::Scholar has refused this runner and it is Monday — if the last few days also failed, the metrics band is going stale. Check recent runs."
            exit 1
          fi
          echo "Blocked today; a later run gets a different IP. Not escalating (not Monday)."
