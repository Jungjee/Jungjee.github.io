name: Weekly metrics refresh

# BACKUP PATH ONLY — the real refresh runs on Jee-weon's Mac via launchd
# (scripts/refresh-metrics-local.sh). Google Scholar refuses GitHub's
# datacenter IPs on nearly every run, so this workflow usually skips; it is
# kept because on the rare day it does get through, it costs nothing and keeps
# the numbers current while the Mac is off.
#
# IMPORTANT: a green run here does NOT mean the numbers were updated. A blocked
# fetch exits 0 on purpose (see the notes on the escalation step below), so
# check the run summary, not the checkmark.

# Refreshes the four numbers in the metrics band of site/index.html
# (Publications / Citations / h-index / i10-index) and pushes to master,
# which Cloudflare Pages auto-deploys.
#
# Citations / h-index / i10-index come from Google Scholar (fetched through a
# fallback chain — Scholar serves a stub to datacenter IPs like this runner's);
# Publications comes from the CV header. See .github/scripts/update_metrics.py.
#
# Runs entirely on GitHub's infrastructure: no local machine and no Claude
# session needed, and GITHUB_TOKEN already carries contents:write (the previous
# cloud-routine approach failed with HTTP 403 on git-receive-pack).
#
# If every Scholar source is blocked the run FAILS on purpose, so GitHub emails
# the repo owner instead of silently skipping a week.

on:
  schedule:
    # Daily, because retrying is only useful across runs: a runner holds one
    # outbound IP for a whole job, and Scholar's block is per-IP. Runs are
    # idempotent (no change -> no commit), so a daily attempt is free and the
    # numbers are never more than a day stale once a fetch gets through.
    - cron: '7 16 * * *'   # 16:07 UTC ≈ 9:07am PT
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Parse and report only; do not commit'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master

      - name: Install poppler (pdftotext)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Refresh metrics in site/index.html
        id: update
        # Exit 2 = every Scholar source refused this runner's IP. That is
        # expected on some days and not worth an email, so swallow it here; the
        # staleness canary below is what catches a genuine, lasting breakage.
        run: |
          set +e
          python3 .github/scripts/update_metrics.py
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$code"

      - name: Commit and push
        if: steps.update.outputs.changed == 'true' && inputs.dry_run != true
        env:
          SUMMARY: ${{ steps.update.outputs.summary }}
        run: |
          git config user.name  'Jee-weon Jung'
          git config user.email 'jeeweonj@ieee.org'
          git add site/index.html
          git commit -m 'chore: weekly metrics refresh' \
                     -m "$SUMMARY" \
                     -m 'Automated by .github/workflows/metrics-refresh.yml'
          git push origin HEAD:master

      - name: Say plainly what happened
        # A green check on a run that did nothing is how the site sat at 5,044
        # for three days while Scholar said 5,096. Write the outcome into the
        # run summary so the truth is visible without opening the log.
        if: always()
        run: |
          if [ "${{ steps.update.outputs.blocked }}" = "true" ]; then
            echo "### ⏭️ SKIPPED — Google Scholar refused this runner's IP" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**The numbers were not updated.** This is expected here; the Mac launchd timer is the primary path." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.update.outputs.changed }}" = "true" ]; then
            echo "### ✅ UPDATED — ${{ steps.update.outputs.summary }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ✅ Reached Scholar; numbers already current" >> "$GITHUB_STEP_SUMMARY"
          fi

      # No Monday escalation any more: this path is expected to be blocked most
      # days, so failing weekly would be pure noise. The Mac timer is the
      # mechanism that must work, and it reports its own failures via a macOS
      # notification (scripts/refresh-metrics-local.sh).
